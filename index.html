<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background-color: #2d2d2d;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 320px;
        }

        .display {
            background-color: #000;
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            text-align: right;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 500;
            height: 65px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.number {
            background-color: #404040;
            color: #fff;
        }

        .btn.number:hover {
            background-color: #505050;
        }

        .btn.operator {
            background-color: #ff9500;
            color: #fff;
        }

        .btn.operator:hover {
            background-color: #ffad33;
        }

        .btn.clear {
            background-color: #a6a6a6;
            color: #000;
        }

        .btn.clear:hover {
            background-color: #b8b8b8;
        }

        .btn.equals {
            background-color: #ff9500;
            color: #fff;
        }

        .btn.equals:hover {
            background-color: #ffad33;
        }

        .btn.zero {
            grid-column: span 2;
            border-radius: 32.5px;
        }

        @media (max-width: 375px) {
            .calculator {
                max-width: 280px;
                padding: 20px;
            }
            
            .display {
                font-size: 2rem;
                padding: 15px;
            }
            
            .btn {
                height: 55px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn clear" onclick="clearCalculator()">C</button>
            <button class="btn number" onclick="inputNumber('±')">±</button>
            <button class="btn number" onclick="inputNumber('%')">%</button>
            <button class="btn operator" onclick="inputOperator('÷')">÷</button>
            
            <button class="btn number" onclick="inputNumber('7')">7</button>
            <button class="btn number" onclick="inputNumber('8')">8</button>
            <button class="btn number" onclick="inputNumber('9')">9</button>
            <button class="btn operator" onclick="inputOperator('×')">×</button>
            
            <button class="btn number" onclick="inputNumber('4')">4</button>
            <button class="btn number" onclick="inputNumber('5')">5</button>
            <button class="btn number" onclick="inputNumber('6')">6</button>
            <button class="btn operator" onclick="inputOperator('−')">−</button>
            
            <button class="btn number" onclick="inputNumber('1')">1</button>
            <button class="btn number" onclick="inputNumber('2')">2</button>
            <button class="btn number" onclick="inputNumber('3')">3</button>
            <button class="btn operator" onclick="inputOperator('+')">+</button>
            
            <button class="btn number zero" onclick="inputNumber('0')">0</button>
            <button class="btn number" onclick="inputNumber('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = '';
        let waitingForNewOperand = false;

        const display = document.getElementById('display');

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function inputNumber(num) {
            if (num === '±') {
                if (currentInput !== '0') {
                    currentInput = currentInput.charAt(0) === '-' 
                        ? currentInput.slice(1) 
                        : '-' + currentInput;
                }
            } else if (num === '%') {
                currentInput = (parseFloat(currentInput) / 100).toString();
            } else if (num === '.') {
                if (waitingForNewOperand) {
                    currentInput = '0.';
                    waitingForNewOperand = false;
                } else if (currentInput.indexOf('.') === -1) {
                    currentInput += '.';
                }
            } else {
                if (waitingForNewOperand) {
                    currentInput = num;
                    waitingForNewOperand = false;
                } else {
                    currentInput = currentInput === '0' ? num : currentInput + num;
                }
            }
            
            updateDisplay();
        }

        function inputOperator(nextOperator) {
            const inputValue = parseFloat(currentInput);

            if (previousInput === '') {
                previousInput = inputValue;
            } else if (operator) {
                const result = performCalculation();
                
                if (result === 'Error') {
                    currentInput = 'Error';
                    previousInput = '';
                    operator = '';
                    waitingForNewOperand = true;
                    updateDisplay();
                    return;
                }
                
                currentInput = String(result);
                previousInput = result;
            }

            waitingForNewOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        function calculate() {
            const inputValue = parseFloat(currentInput);

            if (previousInput !== '' && operator && !waitingForNewOperand) {
                const result = performCalculation();
                
                if (result === 'Error') {
                    currentInput = 'Error';
                    previousInput = '';
                    operator = '';
                    waitingForNewOperand = true;
                } else {
                    currentInput = String(result);
                    previousInput = result;
                    waitingForNewOperand = true;
                }
                
                updateDisplay();
            }
        }

        function performCalculation() {
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) {
                return 'Error';
            }

            switch (operator) {
                case '+':
                    return prev + current;
                case '−':
                    return prev - current;
                case '×':
                    return prev * current;
                case '÷':
                    if (current === 0) {
                        return 'Error';
                    }
                    return prev / current;
                default:
                    return current;
            }
        }

        function clearCalculator() {
            currentInput = '0';
            previousInput = '';
            operator = '';
            waitingForNewOperand = false;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
